<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 560" preserveAspectRatio="xMidYMid slice">
  <!-- ====================================================
       Hero background: Thai beach with limestone cliffs,
       turquoise sea and a long-tail boat (right side).
       Used on the home page hero + guide page banner.
       ==================================================== -->
  <defs>
    <!-- daytime sky -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7ccdf5"/>
      <stop offset="100%" stop-color="#dcf4fd"/>
    </linearGradient>
    <!-- tropical sea -->
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1ba7c9"/>
      <stop offset="55%" stop-color="#45d6cf"/>
      <stop offset="100%" stop-color="#a5f1e9"/>
    </linearGradient>
    <!-- limestone cliff rock -->
    <linearGradient id="cliff" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6d8a5f"/>
      <stop offset="100%" stop-color="#33523c"/>
    </linearGradient>
  </defs>

  <!-- sky -->
  <rect width="1440" height="560" fill="url(#sky)"/>

  <!-- clouds -->
  <g fill="#ffffff" opacity="0.85">
    <ellipse cx="380" cy="95" rx="95" ry="24"/>
    <ellipse cx="330" cy="78" rx="60" ry="20"/>
    <ellipse cx="700" cy="120" rx="70" ry="15" opacity="0.7"/>
    <ellipse cx="860" cy="70" rx="110" ry="24"/>
    <ellipse cx="930" cy="90" rx="70" ry="17"/>
  </g>

  <!-- distant cliffs in the middle -->
  <path d="M540 305 L620 150 L680 225 L750 135 L830 305 Z" fill="#87a893" opacity="0.85"/>
  <path d="M840 305 L905 185 L965 305 Z" fill="#9dbfa9" opacity="0.75"/>

  <!-- big left cliff -->
  <path d="M0 330 L55 115 L140 88 L225 160 L265 330 Z" fill="url(#cliff)"/>
  <path d="M0 330 L38 200 L110 168 L182 245 L205 330 Z" fill="#2f4d38" opacity="0.85"/>
  <!-- big right cliff -->
  <path d="M1170 330 L1255 140 L1340 108 L1440 175 L1440 330 Z" fill="url(#cliff)"/>
  <path d="M1440 330 L1440 210 L1370 180 L1300 250 L1285 330 Z" fill="#2f4d38" opacity="0.85"/>

  <!-- green bushes on the cliff tops -->
  <g fill="#3f7d4d">
    <ellipse cx="90" cy="100" rx="95" ry="30"/>
    <ellipse cx="205" cy="150" rx="60" ry="22"/>
    <ellipse cx="1305" cy="110" rx="105" ry="32"/>
    <ellipse cx="1205" cy="160" rx="60" ry="20"/>
  </g>

  <!-- dark leaves hanging into the picture (top corners) -->
  <g fill="#1f5c30">
    <ellipse cx="30" cy="-10" rx="190" ry="75"/>
    <ellipse cx="185" cy="-20" rx="120" ry="55"/>
    <ellipse cx="1410" cy="-10" rx="210" ry="85"/>
    <ellipse cx="1240" cy="-25" rx="130" ry="60"/>
  </g>

  <!-- sea -->
  <rect y="300" width="1440" height="260" fill="url(#sea)"/>

  <!-- wave highlights -->
  <g fill="#ffffff" opacity="0.35">
    <ellipse cx="300" cy="385" rx="70" ry="6"/>
    <ellipse cx="700" cy="430" rx="90" ry="7"/>
    <ellipse cx="1050" cy="360" rx="60" ry="5"/>
    <ellipse cx="500" cy="505" rx="110" ry="8"/>
    <ellipse cx="905" cy="520" rx="80" ry="7"/>
    <ellipse cx="180" cy="470" rx="60" ry="6"/>
  </g>

  <!-- ================= long-tail boat ================= -->
  <g>
    <!-- mast + canopy -->
    <rect x="1150" y="352" width="8" height="105" fill="#5d3a1a"/>
    <path d="M1080 360 L1240 360 L1225 340 L1095 340 Z" fill="#7a4a21"/>
    <path d="M1080 360 L1240 360 L1236 368 L1084 368 Z" fill="#8f5a2b"/>
    <!-- canopy support strings -->
    <path d="M1100 368 L1120 440 M1225 368 L1205 440" stroke="#5d3a1a" stroke-width="3"/>

    <!-- hull -->
    <path d="M1000 455 Q1150 512 1330 448 L1358 408 L1368 442 Q1330 478 1290 490 Q1140 532 992 472 Z" fill="#7a4a21"/>
    <path d="M1005 462 Q1150 516 1325 455 L1318 448 Q1150 505 1014 452 Z" fill="#5d3a1a" opacity="0.6"/>

    <!-- colorful ribbons at the bow -->
    <g>
      <path d="M1358 408 L1372 384 L1364 412 Z" fill="#ef3340"/>
      <path d="M1352 414 L1374 398 L1360 420 Z" fill="#f2b429"/>
      <path d="M1348 420 L1372 414 L1356 428 Z" fill="#2f9fe0"/>
    </g>

    <!-- Thai flag on the bow -->
    <rect x="1348" y="330" width="4" height="90" fill="#5d3a1a"/>
    <g>
      <rect x="1352" y="330" width="52" height="8"  fill="#ef3340"/>
      <rect x="1352" y="338" width="52" height="8"  fill="#ffffff"/>
      <rect x="1352" y="346" width="52" height="16" fill="#243b8f"/>
      <rect x="1352" y="362" width="52" height="8"  fill="#ffffff"/>
      <rect x="1352" y="370" width="52" height="8"  fill="#ef3340"/>
    </g>
  </g>
</svg>
